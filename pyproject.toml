[project]
name = "agent-learn"
version = "0.1.0"
description = "30 天 AI Agent / RAG 冲刺：手写 Agent Loop、本地 RAG 全链路（bge-m3 + Milvus + BM25 + bge-reranker）、LangGraph 编排、MCP、评测"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "langchain>=1.4.6",
    "langchain-community>=0.4.1",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pymilvus[milvus-lite]>=3.0.2",
    "milvus-lite>=3.2.2",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "transformers>=4.46.0",
    "FlagEmbedding>=1.3.4",
    "pypdf>=5.0.0",
    "torch==2.6.0+cu126",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "ragas>=0.2.0",
    "mcp>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# torch CUDA 版专用源；explicit=true 表示只服务 torch
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
name = "pytorch-cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
